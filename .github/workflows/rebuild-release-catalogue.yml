name: Rebuild the signed release catalogue

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already published on GitHub, for example 1.0.18
        required: true
        type: string

permissions:
  contents: write

jobs:
  rebuild-catalogue:
    runs-on: ubuntu-latest
    environment: production-release
    concurrency:
      group: release-catalogue-${{ inputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '20.19.x'
      - name: Download and verify the existing stable GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Version must use stable X.Y.Z SemVer.' >&2
            exit 1
          fi
          tag="v${RELEASE_VERSION}"
          release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
          jq -e --arg tag "$tag" '.tagName == $tag and .isDraft == false and .isPrerelease == false' \
            <<< "$release_json" >/dev/null
          mkdir -p artifacts
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern 'VeyonCampus-Teacher-Setup-*-win-x64.exe' \
            --pattern 'VeyonCampus-Student-Setup-*-win-x64.exe' \
            --pattern SHA256SUMS
          (
            cd artifacts
            sha256sum --check SHA256SUMS
          )
          test -s "artifacts/VeyonCampus-Teacher-Setup-${RELEASE_VERSION}-win-x64.exe"
          test -s "artifacts/VeyonCampus-Student-Setup-${RELEASE_VERSION}-win-x64.exe"
      - name: Prepare the release signing keys
        env:
          VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM: ${{ vars.VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM }}
          VEYONCAMPUS_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.VEYONCAMPUS_RELEASE_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM \
            VEYONCAMPUS_RELEASE_PRIVATE_KEY_PEM; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release configuration: $name" >&2
              exit 1
            fi
          done
          private_key_path="$RUNNER_TEMP/veyon-campus-release-private.pem"
          public_key_path="$RUNNER_TEMP/veyon-campus-release-public.pem"
          printf '%s' "$VEYONCAMPUS_RELEASE_PRIVATE_KEY_PEM" > "$private_key_path"
          printf '%s' "$VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM" > "$public_key_path"
          chmod 600 "$private_key_path" "$public_key_path"
          {
            printf 'VEYONCAMPUS_RELEASE_PRIVATE_KEY_PATH=%s\n' "$private_key_path"
            printf 'VEYONCAMPUS_RELEASE_PUBLIC_KEY_PATH=%s\n' "$public_key_path"
          } >> "$GITHUB_ENV"
      - name: Download the existing catalogue so the Agent sidecar can be carried over
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern release-catalog.json || true
      - name: Rebuild and re-upload the signed release catalogue
        env:
          VEYONCAMPUS_RELEASE_PRIVATE_KEY_PATH: ${{ runner.temp }}/veyon-campus-release-private.pem
          VEYONCAMPUS_RELEASE_PUBLIC_KEY_PATH: ${{ runner.temp }}/veyon-campus-release-public.pem
          VEYONCAMPUS_RELEASE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.VEYONCAMPUS_RELEASE_PRIVATE_KEY_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          catalog="artifacts/release-catalog.json"
          if [[ ! -s "$catalog" ]]; then
            printf '{"schemaVersion":1,"tag":"%s","roles":{}}\n' "$tag" > "$catalog"
          fi
          node scripts/build-release-catalog.cjs \
            --role TeacherConsole --version "$RELEASE_VERSION" --tag "$tag" \
            --installer "artifacts/VeyonCampus-Teacher-Setup-${RELEASE_VERSION}-win-x64.exe" \
            --output "$catalog"
          node scripts/build-release-catalog.cjs \
            --role StudentSetup --version "$RELEASE_VERSION" --tag "$tag" \
            --installer "artifacts/VeyonCampus-Student-Setup-${RELEASE_VERSION}-win-x64.exe" \
            --output "$catalog"
          # Published releases are immutable: this workflow only fills in a catalogue that the
          # original build never attached. A catalogue that exists but is wrong is a release defect,
          # and the fix for that is a new version, not a silent replacement.
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx release-catalog.json; then
            echo "v${RELEASE_VERSION} already carries a release catalogue; published assets are immutable." >&2
            echo 'Publish a new version if the catalogue itself has to change.' >&2
            exit 1
          fi
          gh release upload "$tag" "$catalog"
