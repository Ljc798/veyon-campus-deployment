name: Windows installers

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*', 'beta-v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-installers:
    runs-on: windows-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM: ${{ vars.VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (startsWith(github.ref, 'refs/tags/beta-v') && github.ref_name || (github.event.head_commit.message == 'Release v1.1.7' && 'v1.1.7' || (github.event.head_commit.message == 'Release v1.1.0' && 'v1.1.0' || (github.event.head_commit.message == 'Release v1.0.10' && 'v1.0.10' || (github.event.head_commit.message == 'Release v1.0.19' && 'v1.0.19' || (github.event.head_commit.message == 'Release v1.0.20' && 'v1.0.20' || (github.event.head_commit.message == 'Release v1.1.4' && 'v1.1.4' || ''))))))) }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse the student update G0 collector with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $collectorPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/collect-student-update-g0-evidence.ps1'
          $parserScriptPath = Join-Path $env:RUNNER_TEMP 'parse-windows-powershell-script.ps1'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $parserScript = @'
          param([Parameter(Mandatory = $true)][string]$ScriptPath)
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($ScriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                  Write-Error ("{0}:{1}: {2}" -f $parseError.Extent.StartLineNumber,
                      $parseError.Extent.StartColumnNumber, $parseError.Message)
              }
              exit 1
          }
          Write-Host 'Windows PowerShell 5.1 parser accepted the G0 evidence collector.'
          '@
          [IO.File]::WriteAllText($parserScriptPath, $parserScript, [Text.UTF8Encoding]::new($false))
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $parserScriptPath $collectorPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '20'
      - name: Prepare pinned Developer Release public key
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM)) {
            throw 'Set the repository variable VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM before creating a production release tag.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'veyon-campus-release-public.pem'
          [IO.File]::WriteAllText($keyPath, $env:VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM, [Text.UTF8Encoding]::new($false))
          "VEYONCAMPUS_RELEASE_PUBLIC_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run CloudBase API contract checks
        run: npm run check --prefix cloudfunctions/veyon-api
      - name: Run GitHub release immutability checks
        run: node --test scripts/publish-github-release.test.cjs scripts/external-release-download.test.cjs
      - name: Run signed file update publication contract checks
        run: node --test scripts/publish-gitcode-release.test.cjs scripts/publish-github-release.test.cjs scripts/publish-file-update-release.test.cjs
      - name: Run file manifest planning and release tooling checks
        run: node --test scripts/file-update-planner.test.cjs scripts/file-update-release.test.cjs scripts/prepare-file-update-source-baselines.test.cjs
      - name: Run .NET application checks
        run: dotnet run --project tests/VeyonCampus.Checks/VeyonCampus.Checks.csproj -c Release
      - name: Verify Teacher LAN serving, interruption resume, and Windows artifact lease
        shell: pwsh
        run: |
          $fixtureOutput = & dotnet run --project tests/VeyonCampus.Checks/VeyonCampus.Checks.csproj -c Release --no-build -- --student-update-lan-http-fixture 2>&1
          $fixtureExitCode = $LASTEXITCODE
          foreach ($line in $fixtureOutput) { Write-Host $line }
          if ($fixtureExitCode -ne 0) { exit $fixtureExitCode }

          $fixtureText = ($fixtureOutput -join "`n").Replace("`r", '')
          if ($fixtureText -notmatch '(?m)^PASS Windows-only artifact lease write-exclusion assertion\.$') {
            throw 'Windows LAN fixture did not prove that the active artifact lease rejects writable opens.'
          }
          if ($fixtureText -match '(?m)^SKIP Windows-only artifact lease write-exclusion assertion') {
            throw 'Windows LAN fixture skipped its Windows-specific artifact lease assertion.'
          }
          if ($fixtureText -notmatch '(?m)^PASS actual Teacher LAN HTTP signed Agent/command binding, replay rejection, legacy migration grant, 10 concurrent downloads, Range, If-Range, 416, 400, prefix resume, and TCP interruption/reconnect/resume$') {
            throw 'Windows LAN fixture did not complete its transfer, concurrency, and interruption checks.'
          }
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Install hash-pinned Simplified Chinese language file
        shell: pwsh
        run: |
          $languageUrl = 'https://raw.githubusercontent.com/jrsoftware/issrc/ee8ee564988a7661bb5db594050e47fd7bb7bc64/Files/Languages/Unofficial/ChineseSimplified.isl'
          $languageDownload = Join-Path $env:RUNNER_TEMP 'ChineseSimplified-6.7.1.isl'
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $languageDirectory = Join-Path (Join-Path $programFilesX86 'Inno Setup 6') 'Languages'
          $languageTarget = Join-Path $languageDirectory 'ChineseSimplified.isl'
          Invoke-WebRequest -Uri $languageUrl -OutFile $languageDownload
          $actualHash = (Get-FileHash -LiteralPath $languageDownload -Algorithm SHA256).Hash
          Write-Host "Downloaded ChineseSimplified.isl SHA-256: $actualHash"
          if ($actualHash -cne '7D544B9BB1D142CFA11F2E5D3CC8ABE2E55F8E066C5124E3772675AA236E1278') {
            throw 'The downloaded Inno Setup 6.7.1 Simplified Chinese language file does not match the pinned SHA-256.'
          }
          if (-not (Test-Path -LiteralPath $languageDirectory -PathType Container)) {
            throw 'Inno Setup 6.7.1 language directory was not found after installation.'
          }
          Copy-Item -LiteralPath $languageDownload -Destination $languageTarget -Force
      - name: Build Student installer
        shell: pwsh
        run: |
          $packageArguments = @{
            Role = 'StudentSetup'
            Clean = $true
            FileUpdateHelperDirectory = 'artifacts/file-update-inventory/payloads/student/StudentUpdateHelperVersioned'
          }
          if ($env:GITHUB_REF -like 'refs/tags/beta-v*' -or $env:GITHUB_REF -like 'refs/heads/beta-v*') { $packageArguments['EdgeRealtimeManualTest'] = $true }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            $packageArguments['ReleasePublicKeyPath'] = $env:VEYONCAMPUS_RELEASE_PUBLIC_KEY_PATH
          }
          & ./scripts/package-windows-offline.ps1 @packageArguments
      - name: Build Teacher installer
        shell: pwsh
        run: |
          $packageArguments = @{
            Role = 'TeacherConsole'
            Clean = $true
            FileUpdateHelperDirectory = 'artifacts/file-update-inventory/payloads/teacher/TeacherUpdateHelperVersioned'
          }
          if ($env:GITHUB_REF -like 'refs/tags/beta-v*' -or $env:GITHUB_REF -like 'refs/heads/beta-v*') { $packageArguments['EdgeRealtimeManualTest'] = $true }
          if ($env:RELEASE_TAG -in @('v1.1.33', 'v1.1.34', 'v1.1.35', 'v1.1.36', 'v1.1.37')) { $packageArguments['ClassroomQuickControlManualTest'] = $true }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            $packageArguments['ReleasePublicKeyPath'] = $env:VEYONCAMPUS_RELEASE_PUBLIC_KEY_PATH
          }
          & ./scripts/package-windows-offline.ps1 @packageArguments
      - name: Generate and inspect unsigned role file manifests
        shell: pwsh
        run: |
          $appProjectPath = Join-Path $env:GITHUB_WORKSPACE 'src/VeyonCampus.App/VeyonCampus.App.csproj'
          $appProject = [xml](Get-Content -LiteralPath $appProjectPath -Raw -Encoding UTF8)
          $appVersion = [string](@($appProject.Project.PropertyGroup | ForEach-Object { $_.Version } |
            Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) } | Select-Object -First 1)[0])
          if ([string]::IsNullOrWhiteSpace($appVersion)) { throw 'Could not read the package version for file manifest inventory.' }
          $channel = if ($env:RELEASE_TAG -match '^v' -and $env:RELEASE_TAG -notmatch '^beta-v') { 'stable' } else { 'beta' }
          $nodeArguments = @(
            'scripts/generate-file-update-inventories.cjs',
            '--student-app', "artifacts/windows-x64-v$appVersion-student-setup",
            '--student-helper', 'artifacts/file-update-inventory/payloads/student/StudentUpdateHelperVersioned',
            '--teacher-app', "artifacts/windows-x64-v$appVersion-teacher-console",
            '--teacher-helper', 'artifacts/file-update-inventory/payloads/teacher/TeacherUpdateHelperVersioned',
            '--output-directory', 'artifacts/file-update-inventory/manifests',
            '--release-sequence', $env:GITHUB_RUN_NUMBER,
            '--channel', $channel
          )
          & node @nodeArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify Windows inventories with an ephemeral test key
        shell: pwsh
        run: |
          $appProjectPath = Join-Path $env:GITHUB_WORKSPACE 'src/VeyonCampus.App/VeyonCampus.App.csproj'
          $appProject = [xml](Get-Content -LiteralPath $appProjectPath -Raw -Encoding UTF8)
          $appVersion = [string](@($appProject.Project.PropertyGroup | ForEach-Object { $_.Version } |
            Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) } | Select-Object -First 1)[0])
          if ([string]::IsNullOrWhiteSpace($appVersion)) { throw 'Could not read the package version for file manifest verification.' }
          $verificationReportPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/file-update-inventory/ephemeral-verification.json'
          $verificationArguments = @(
            'scripts/verify-file-update-inventories.cjs',
            '--manifest-directory', 'artifacts/file-update-inventory/manifests',
            '--student-app', "artifacts/windows-x64-v${appVersion}-student-setup",
            '--student-helper', 'artifacts/file-update-inventory/payloads/student/StudentUpdateHelperVersioned',
            '--teacher-app', "artifacts/windows-x64-v${appVersion}-teacher-console",
            '--teacher-helper', 'artifacts/file-update-inventory/payloads/teacher/TeacherUpdateHelperVersioned'
          )
          $verificationLines = & node @verificationArguments
          $verificationExitCode = $LASTEXITCODE
          if ($verificationExitCode -ne 0) {
            $verificationLines | Write-Output
            exit $verificationExitCode
          }
          $verificationJson = $verificationLines -join [Environment]::NewLine
          [IO.File]::WriteAllText($verificationReportPath, $verificationJson + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          $verification = $verificationJson | ConvertFrom-Json
          $expectedRoles = @('StudentSetup', 'TeacherConsole')
          $actualRoles = @($verification.results | ForEach-Object { [string]$_.role } | Sort-Object -Unique)
          if ($verification.roleCount -ne 2 -or (Compare-Object $expectedRoles $actualRoles).Count -ne 0 -or
              $verification.ephemeralSigningKey -ne $true -or $verification.temporaryArtifactsRemoved -ne $true -or
              $verification.installedMachineModified -ne $false -or $verification.productionPublished -ne $false -or
              $verification.deployable -ne $false) {
            throw 'Windows inventory verification report did not prove both roles were locally verified with an ephemeral key and no publication or installation.'
          }
          foreach ($roleResult in $verification.results) {
            if ($roleResult.fileCount -lt 1 -or $roleResult.verifiedObjectCount -lt 1 -or
                $roleResult.verifiedComponentPackCount -lt 1 -or $roleResult.verifiedComponentPackBytes -lt 1 -or
                $roleResult.signatureVerified -ne $true -or $roleResult.objectsVerified -ne $true -or
                $roleResult.deployable -ne $false) {
              throw "Windows inventory verification failed role $($roleResult.role)."
            }
          }
      - name: Verify repeated Windows Agent deployment and recovery
        env:
          VEYONCAMPUS_ALLOW_AGENT_SYSTEM_FIXTURE: '1'
        shell: pwsh
        run: |
          $fixtureOutput = & dotnet run --project tests/VeyonCampus.Checks/VeyonCampus.Checks.csproj -c Release --no-build -- --agent-reconfiguration-fixtures 2>&1
          $fixtureExitCode = $LASTEXITCODE
          foreach ($line in $fixtureOutput) { Write-Host $line }

          $reportLine = $fixtureOutput | ForEach-Object { [string]$_ } |
            Where-Object { $_.StartsWith('STUDENT_RECOVERY_TASK_REPORT=', [StringComparison]::Ordinal) } |
            Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($reportLine)) {
            $report = @{
              schemaVersion = 1
              kind = 'VeyonCampus.StudentUpdateRecoveryTaskFixture'
              status = 'failed'
              scope = 'fixture-process-startup'
              g0Acceptance = $false
              failedStage = 'fixture-process'
              failureType = 'StructuredReportMissing'
              environment = @{
                osVersion = [Environment]::OSVersion.Version.ToString()
                osVersionString = [Environment]::OSVersion.VersionString
                githubActions = $env:GITHUB_ACTIONS -eq 'true'
                runnerImageOs = $env:ImageOS
                runnerImageVersion = $env:ImageVersion
                runId = $env:GITHUB_RUN_ID
                commit = $env:GITHUB_SHA
              }
              checks = @{}
            }
            $reportJson = $report | ConvertTo-Json -Depth 8 -Compress
          } else {
            $reportJson = $reportLine.Substring('STUDENT_RECOVERY_TASK_REPORT='.Length)
          }

          $reportPath = Join-Path $env:RUNNER_TEMP 'student-update-system-task-fixture.json'
          [IO.File]::WriteAllText($reportPath, $reportJson + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          Write-Host "Structured SYSTEM task evidence written: $reportPath"
          if ($fixtureExitCode -ne 0) { exit $fixtureExitCode }
          if ([string]::IsNullOrWhiteSpace($reportLine)) {
            throw 'Student recovery task fixture did not emit its structured report.'
          }

          $report = $reportJson | ConvertFrom-Json
          if ($report.kind -ne 'VeyonCampus.StudentUpdateRecoveryTaskFixture' -or
              $report.status -ne 'passed' -or $report.g0Acceptance -ne $false -or
              $report.checks.elevatedRunner -ne $true -or
              $report.checks.existingAgentTaskReadback -ne $true -or
              $report.checks.requestAclReadback -ne $true -or
              $report.checks.systemTaskScheduled -ne $true -or
              $report.checks.systemIdentity -ne $true -or
              $report.checks.bootTaskAction -ne $true -or
              $report.checks.watchdogTaskAction -ne $true -or
              $report.checks.bootTaskAcl -ne $true -or
              $report.checks.watchdogTaskAcl -ne $true -or
              $report.checks.bootTrigger -ne $true -or
              $report.checks.watchdogTrigger -ne $true -or
              $report.checks.watchdogOneMinuteSchedule -ne $true -or
              $report.checks.recoveryTasksRegisteredBySystem -ne $true -or
              $report.checks.recoveryTasksRemoved -ne $true -or
              $report.checks.systemChildPassed -ne $true -or
              $report.checks.healthRepairUpdateLockRejected -ne $true) {
            throw 'Student recovery task fixture report failed scope or safety validation.'
          }
      - name: Verify Student atomic journal and NTFS rollback storage
        env:
          VEYONCAMPUS_ALLOW_STUDENT_UPDATE_ATOMIC_STORAGE_FIXTURE: '1'
        shell: pwsh
        run: |
          $fixtureOutput = & dotnet run --project tests/VeyonCampus.Checks/VeyonCampus.Checks.csproj -c Release --no-build -- --student-update-atomic-storage-fixtures 2>&1
          $fixtureExitCode = $LASTEXITCODE
          foreach ($line in $fixtureOutput) { Write-Host $line }

          $reportLine = $fixtureOutput | ForEach-Object { [string]$_ } |
            Where-Object { $_.StartsWith('STUDENT_ATOMIC_STORAGE_REPORT=', [StringComparison]::Ordinal) } |
            Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($reportLine)) {
            $report = @{
              schemaVersion = 1
              kind = 'VeyonCampus.StudentUpdateAtomicStorageFixture'
              status = 'failed'
              scope = 'fixture-process-startup'
              g0Acceptance = $false
              failedStage = 'fixture-process'
              failureType = 'StructuredReportMissing'
              environment = @{
                osVersion = [Environment]::OSVersion.Version.ToString()
                osVersionString = [Environment]::OSVersion.VersionString
                githubActions = $env:GITHUB_ACTIONS -eq 'true'
                runnerImageOs = $env:ImageOS
                runnerImageVersion = $env:ImageVersion
                runId = $env:GITHUB_RUN_ID
                commit = $env:GITHUB_SHA
              }
              checks = @{}
            }
            $reportJson = $report | ConvertTo-Json -Depth 8 -Compress
          } else {
            $reportJson = $reportLine.Substring('STUDENT_ATOMIC_STORAGE_REPORT='.Length)
          }

          $reportPath = Join-Path $env:RUNNER_TEMP 'student-update-atomic-storage-fixture.json'
          [IO.File]::WriteAllText($reportPath, $reportJson + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          Write-Host "Structured storage-only evidence written: $reportPath"
          if ($fixtureExitCode -ne 0) { exit $fixtureExitCode }
          if ([string]::IsNullOrWhiteSpace($reportLine)) {
            throw 'Student atomic storage fixture did not emit its structured report.'
          }

          $report = $reportJson | ConvertFrom-Json
          if ($report.kind -ne 'VeyonCampus.StudentUpdateAtomicStorageFixture' -or
              $report.status -ne 'passed' -or $report.g0Acceptance -ne $false -or
              $report.checks.windowsPlatform -ne $true -or
              $report.checks.explicitOptIn -ne $true -or
              $report.checks.elevatedRunner -ne $true -or
              $report.checks.protectedJournalAclReadback -ne $true -or
              $report.checks.staleJournalSnapshotRejected -ne $true -or
              $report.checks.sameVolumePreviousSetupPreserved -ne $true -or
              $report.checks.candidateIsolatedAndPreviousSetupRestored -ne $true -or
              $report.checks.unknownJournalStateRejected -ne $true -or
              $report.checks.malformedJournalRecoveryMaterialsRetained -ne $true) {
            throw 'Student atomic storage fixture report failed scope or safety validation.'
          }
      - name: Install, verify, and uninstall both installers
        shell: pwsh
        run: |
          $smokeScriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\test-windows-installers.ps1'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File $smokeScriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer names match release tag
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -match '^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') {
            $version = $Matches[1]
          } elseif ($env:RELEASE_TAG -match '^beta-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') {
            $version = $Matches[1]
          } else {
            throw 'Installer release tags must use vX.Y.Z or beta-vX.Y.Z.'
          }
          foreach ($fileName in @(
            "VeyonCampus-Student-Setup-$version-win-x64.exe",
            "VeyonCampus-Teacher-Setup-$version-win-x64.exe"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts' $fileName) -PathType Leaf)) {
              throw "The project version does not match tag $($env:RELEASE_TAG): missing $fileName."
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers-${{ github.run_id }}
          path: |
            artifacts/VeyonCampus-*-Setup-*-win-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: read-only-file-update-inventory-${{ github.run_id }}
          path: |
            artifacts/file-update-inventory/manifests/*.json
            artifacts/file-update-inventory/manifests/README.md
            artifacts/file-update-inventory/ephemeral-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: student-update-atomic-storage-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/student-update-atomic-storage-fixture.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: student-update-system-task-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/student-update-system-task-fixture.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && (github.event.head_commit.message == 'Release v1.1.7' || github.event.head_commit.message == 'Release v1.1.0' || github.event.head_commit.message == 'Release v1.0.10' || github.event.head_commit.message == 'Release v1.0.19' || github.event.head_commit.message == 'Release v1.0.20' || github.event.head_commit.message == 'Release v1.1.4'))
    needs: build-installers
    runs-on: ubuntu-latest
    environment: production-release
    concurrency:
      group: production-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event.head_commit.message == 'Release v1.1.7' && 'v1.1.7' || (github.event.head_commit.message == 'Release v1.1.0' && 'v1.1.0' || (github.event.head_commit.message == 'Release v1.0.10' && 'v1.0.10' || (github.event.head_commit.message == 'Release v1.0.20' && 'v1.0.20' || (github.event.head_commit.message == 'Release v1.1.4' && 'v1.1.4' || 'v1.0.19'))))) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '20.19.x'
      - uses: actions/download-artifact@v7
        with:
          name: windows-installers-${{ github.run_id }}
          path: artifacts
      - name: Check release configuration and prepare signing keys
        env:
          VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM: ${{ vars.VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM }}
          VEYONCAMPUS_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.VEYONCAMPUS_RELEASE_PRIVATE_KEY_PEM }}
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_SERVICE_ROLE_KEY_ROTATED_AFTER_20260930_REVIEW: ${{ secrets.CLOUDBASE_SERVICE_ROLE_KEY_ROTATED_AFTER_20260930_REVIEW }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM \
            VEYONCAMPUS_RELEASE_PRIVATE_KEY_PEM \
            CLOUDBASE_ENV_ID \
            CLOUDBASE_API_KEY \
            CLOUDBASE_SERVICE_ROLE_KEY_ROTATED_AFTER_20260930_REVIEW; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if [[ "${CLOUDBASE_SERVICE_ROLE_KEY_ROTATED_AFTER_20260930_REVIEW:-}" != "yes" ]]; then
            echo 'Rotate the CloudBase service API key and set the matching release acknowledgement secret first.' >&2
            exit 1
          fi
          if ((${#missing[@]})); then
            printf 'Missing release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          private_key_path="$RUNNER_TEMP/veyon-campus-release-private.pem"
          public_key_path="$RUNNER_TEMP/veyon-campus-release-public.pem"
          printf '%s' "$VEYONCAMPUS_RELEASE_PRIVATE_KEY_PEM" > "$private_key_path"
          printf '%s' "$VEYONCAMPUS_RELEASE_PUBLIC_KEY_PEM" > "$public_key_path"
          chmod 600 "$private_key_path" "$public_key_path"
          {
            printf 'VEYONCAMPUS_RELEASE_PRIVATE_KEY_PATH=%s\n' "$private_key_path"
            printf 'VEYONCAMPUS_RELEASE_PUBLIC_KEY_PATH=%s\n' "$public_key_path"
          } >> "$GITHUB_ENV"
      - name: Verify assets and calculate SHA-256 checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Production release tags must use stable vX.Y.Z SemVer.' >&2
            exit 1
          fi
          version="${tag#v}"
          student="artifacts/VeyonCampus-Student-Setup-${version}-win-x64.exe"
          teacher="artifacts/VeyonCampus-Teacher-Setup-${version}-win-x64.exe"
          test -s "$student"
          test -s "$teacher"
          (
            cd artifacts
            sha256sum \
              "$(basename "$student")" \
              "$(basename "$teacher")" > SHA256SUMS
          )
          printf 'version=%s\nstudent=%s\nteacher=%s\nchecksums=artifacts/SHA256SUMS\n' \
            "$version" "$student" "$teacher" >> "$GITHUB_OUTPUT"
      - name: Prepare public release notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="docs/releases/v${{ steps.assets.outputs.version }}.md"
          if [[ ! -s "$notes_path" ]]; then
            echo "Missing versioned release notes: ${notes_path}" >&2
            exit 1
          fi
          cp "$notes_path" "$RUNNER_TEMP/release-notes.md"
      - name: Create or verify the release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && (github.event.head_commit.message == 'Release v1.1.7' || github.event.head_commit.message == 'Release v1.1.0' || github.event.head_commit.message == 'Release v1.0.10' || github.event.head_commit.message == 'Release v1.0.19' || github.event.head_commit.message == 'Release v1.0.20' || github.event.head_commit.message == 'Release v1.1.4')
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          ref_url="/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"
          if existing_sha="$(gh api "$ref_url" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "The ${tag} tag already points to a different commit." >&2
              exit 1
            fi
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" -f sha="$GITHUB_SHA"
          fi
      - name: Publish or verify GitHub Release assets
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          node scripts/publish-github-release.cjs \
            "$tag" "${{ steps.assets.outputs.version }}" \
            "${{ steps.assets.outputs.student }}" \
            "${{ steps.assets.outputs.teacher }}" \
            "${{ steps.assets.outputs.checksums }}" \
            "$RUNNER_TEMP/release-notes.md"
      - name: Publish signed version metadata to CloudBase after GitHub assets are verified
        env:
          VEYONCAMPUS_RELEASE_PRIVATE_KEY_PATH: ${{ runner.temp }}/veyon-campus-release-private.pem
          VEYONCAMPUS_RELEASE_PUBLIC_KEY_PATH: ${{ runner.temp }}/veyon-campus-release-public.pem
          VEYONCAMPUS_RELEASE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.VEYONCAMPUS_RELEASE_PRIVATE_KEY_PASSPHRASE }}
          CloudBase__EnvId: ${{ secrets.CLOUDBASE_ENV_ID }}
          CloudBase__ApiKey: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_SERVICE_ROLE_KEY_ROTATED_AFTER_20260930_REVIEW: ${{ secrets.CLOUDBASE_SERVICE_ROLE_KEY_ROTATED_AFTER_20260930_REVIEW }}
        run: |
          set -euo pipefail
          node scripts/publish-application-release.cjs \
            --role TeacherConsole --version "${{ steps.assets.outputs.version }}" \
            --installer "${{ steps.assets.outputs.teacher }}" --confirm-publication
          node scripts/publish-application-release.cjs \
            --role StudentSetup --version "${{ steps.assets.outputs.version }}" \
            --installer "${{ steps.assets.outputs.student }}" --confirm-publication

  publish-beta-release:
    if: startsWith(github.ref, 'refs/tags/beta-v') || startsWith(github.ref, 'refs/heads/beta-v')
    needs: build-installers
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: windows-installers-${{ github.run_id }}
          path: artifacts
      - name: Create or verify the Beta release tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${TAG%-retry*}"
          if [[ ! "$TAG" =~ ^beta-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Beta tags must use beta-vX.Y.Z and match the installer version.' >&2
            exit 1
          fi
          ref_url="/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          if existing_sha="$(gh api "$ref_url" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$existing_sha" != "$COMMIT_SHA" ]]; then
              echo "The ${TAG} tag already points to a different commit." >&2
              exit 1
            fi
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${COMMIT_SHA}"
          fi
      - name: Verify beta assets and create the public prerelease
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${TAG%-retry*}"
          if [[ ! "$TAG" =~ ^beta-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Beta tags must use beta-vX.Y.Z and match the installer version.' >&2
            exit 1
          fi
          version="${TAG#beta-v}"
          student="artifacts/VeyonCampus-Student-Setup-${version}-win-x64.exe"
          teacher="artifacts/VeyonCampus-Teacher-Setup-${version}-win-x64.exe"
          test -s "$student"
          test -s "$teacher"
          (
            cd artifacts
            sha256sum \
              "$(basename "$student")" \
              "$(basename "$teacher")" > SHA256SUMS
          )
          cat > "$RUNNER_TEMP/beta-release-notes.md" <<EOF
          ## Veyon Campus ${version} Beta

          用于 Windows 10/11 x64 实机测试的预发布版本，不会发布到 CloudBase 自动更新目录。

          构建提交：${COMMIT_SHA}

          每台电脑按用途下载并运行教师端或学生端 EXE 安装程序。GitHub Release 提供 EXE 文件和 SHA-256 校验值。

          此 Beta 包含 Edge 实时网站策略试用。学生电脑安装后需按安装目录中的 EDGE-REALTIME-MANUAL-TEST.md 在 edge://extensions 手动加载扩展；教师端提供启用与恢复 Edge 策略操作。它不会静默安装 Edge 扩展，也不会进入自动更新目录。

          GitCode/AtomGit 附件由维护者在本机上传：https://gitcode.com/ljc_1126/veyon-campus-deployment/releases

          安装包未进行 Authenticode 签名。请在可恢复的测试电脑上验证，不要首次在正式课堂设备或真实学生账户上测试。
          EOF
      - name: Publish or verify GitHub Beta Release first
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME%-retry*}"
          version="${tag#beta-v}"
          node scripts/publish-github-release.cjs \
            "$tag" "$version" \
            "artifacts/VeyonCampus-Student-Setup-${version}-win-x64.exe" \
            "artifacts/VeyonCampus-Teacher-Setup-${version}-win-x64.exe" \
            artifacts/SHA256SUMS "$RUNNER_TEMP/beta-release-notes.md"
