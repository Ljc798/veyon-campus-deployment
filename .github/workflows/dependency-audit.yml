name: Dependency audit

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'Directory.Build.props'
      - 'VeyonCampus.slnx'
      - 'global.json'
      - 'src/**/*.csproj'
      - 'src/**/packages*.json'
      - 'tests/**/*.csproj'
      - 'tests/**/packages*.json'
      - 'tools/**/*.csproj'
      - 'tools/**/packages*.json'
      - 'scripts/check-dotnet-vulnerabilities.cjs'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'Directory.Build.props'
      - 'VeyonCampus.slnx'
      - 'global.json'
      - 'src/**/*.csproj'
      - 'src/**/packages*.json'
      - 'tests/**/*.csproj'
      - 'tests/**/packages*.json'
      - 'tools/**/*.csproj'
      - 'tools/**/packages*.json'
      - 'scripts/check-dotnet-vulnerabilities.cjs'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: read

jobs:
  nuget-vulnerability-audit:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore locked NuGet dependencies
        run: dotnet restore VeyonCampus.slnx --locked-mode

      - name: Audit direct and transitive NuGet packages
        run: node scripts/check-dotnet-vulnerabilities.cjs

      - name: Upload NuGet vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-vulnerability-report-${{ github.run_id }}
          path: artifacts/dependency-audit/dotnet-vulnerability-report.json
          if-no-files-found: ignore
          retention-days: 30
