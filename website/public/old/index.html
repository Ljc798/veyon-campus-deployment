<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidsCode - 网站停服通知</title>
    <style>
        /* ========== 基础重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'STHeiti', Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ========== 背景层 ========== */
        .bg-blur {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            filter: blur(60px);
            -webkit-filter: blur(60px);
            z-index: 0;
            opacity: 0.7;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        /* ========== 导航栏 ========== */
        .nav-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1101;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; box-sizing: border-box;
            border-bottom: solid #e5e7eb 1px;
        }
        .nav-logo { color: #667eea; font-size: 1.5rem; font-weight: bold; }
        .nav-menu { display: flex; gap: 30px; }
        .nav-item { color: #4b5563; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s; }
        .nav-item:hover { color: #667eea; }
        .nav-item.site-switch {
            padding: 8px 14px;
            border: 1px solid rgba(102, 126, 234, 0.36);
            border-radius: 999px;
            color: #667eea;
            background: #fff;
            font-weight: 700;
            white-space: nowrap;
        }
        .nav-item.site-switch:hover { border-color: #667eea; }

        /* ========== 主内容区 ========== */
        .content {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 100px 20px 40px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; padding: 40px;
            max-width: 600px; width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .main-card h1 {
            font-size: 2rem; font-weight: bold;
            color: #1f2937; margin-bottom: 12px;
        }
        .main-card p {
            color: #6b7280; line-height: 1.6;
            font-size: 1.05rem;
        }

        /* ========== ServiceNotice 弹窗容器 ========== */
        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center; align-items: center;
            z-index: 1000;
            animation: fadeIn 0.4s ease-out;
            background: rgba(0, 0, 0, 0.4);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ========== ServiceNotice 弹窗主体 ========== */
        .modal {
            position: relative;
            width: 100%; max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            /* 渐变色：米白 → 浅蓝，与原图一致 */
            background: linear-gradient(to bottom, #fffef7 0%, #f0f9ff 100%);
            padding: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            /* 确保垂直居中 */
            display: flex; flex-direction: column;
        }

        /* ========== 左上角装饰（实际在原图左侧） ========== */
        .left-decoration {
            position: absolute; left: -10px; bottom: -10px;
            font-size: 1.8rem; user-select: none; -webkit-user-select: none; opacity: 0.9;
        }

        /* ========== 右上角关闭按钮（存在但禁用） ========== */
        .close-btn {
            position: absolute; top: 15px; right: 15px;
            width: 28px; height: 28px;
            background: white; border: 1px solid #d1d5db;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 1.1rem; color: #6b7280;
            cursor: not-allowed !important;
            pointer-events: none !important;
            opacity: 0.6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        /* ========== 通知头部 ========== */
        .notice-header {
            display: flex; align-items: center; margin-bottom: 18px;
            margin-top: 5px;
        }
        .notice-icon { font-size: 1.3rem; margin-right: 10px; }
        .notice-title {
            font-size: 1.35rem; font-weight: 700;
            color: #f59e0b; /* 橙色 */
        }

        /* ========== 正文内容 ========== */
        .notice-body {
            color: #374151; line-height: 1.8;
            font-size: 1rem; text-align: left;
            margin-bottom: 20px;
        }
        .notice-body p { margin-bottom: 8px; }

        .highlight-date {
            color: #8b5cf6; /* 紫色 */
            font-weight: 700;
            display: block; margin: 10px 0;
        }

        /* ========== 联系方式框 ========== */
        .contact-box {
            border: 2px dashed #3b82f6; /* 蓝色虚线 */
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            /* 浅蓝色背景渐变，与原图一致 */
            background: linear-gradient(to bottom, #eff6ff 0%, #dbeafe 80%, #e0f2fe 100%);
            text-align: center;
        }
        .contact-text {
            font-size: 0.95rem; color: #1f2937;
            margin-bottom: 8px; line-height: 1.5;
        }
        .contact-label {
            font-size: 0.95rem; font-weight: 600;
            color: #2563eb; margin-bottom: 10px;
        }
        .contact-wx {
            font-size: 1.55rem; font-weight: bold;
            color: #1e40af; letter-spacing: 1px;
            word-break: break-all;
        }

        /* ========== 底部文字 ========== */
        .notice-footer {
            color: #6b7280; font-size: 0.9rem;
            text-align: center; margin-top: auto;
            line-height: 1.5;
        }

        /* ========== 防护：禁止关闭 ========== */
        .modal, .modal-overlay {
            user-select: none; -webkit-user-select: none;
            cursor: default !important;
        }

        /* 响应式适配 */
        @media (max-width: 480px) {
            .nav-bar { padding: 0 20px; }
            .modal { padding: 25px 20px; }
            .contact-wx { font-size: 1.3rem; }
        }
        @media (max-width: 900px) {
            .nav-menu { gap: 0; }
            .nav-menu .nav-item:not(.site-switch) { display: none; }
        }
    </style>
</head>
<body>
    <!-- 背景层 -->
    <div class="bg-blur"></div>

    <!-- 导航栏 -->
    <div class="nav-bar">
        <div class="nav-logo">KidsCode</div>
        <div class="nav-menu">
            <a href="#" class="nav-item">首页</a>
            <a href="#" class="nav-item">作品</a>
            <a href="#" class="nav-item">课堂</a>
            <a href="#" class="nav-item">资料库</a>
            <a href="#" class="nav-item">排行榜</a>
            <a href="#" class="nav-item">个人中心</a>
            <a href="/sites/" target="_top" class="nav-item site-switch">切换站点</a>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="content">
        <div class="main-card">
            <h1>一个全新的·马上开始</h1>
            <p>欢迎来到 KidsCode，编程学习从这里开始。这里有各种有趣的项目等着你去探索。</p>
        </div>
    </div>

    <!-- ServiceNotice 模态弹窗（不可关闭） -->
    <div class="modal-overlay" id="shutdownModal">
        <div class="modal">
            <!-- 左侧装饰 ❤️ -->
            <div class="left-decoration">❤️</div>

            <!-- 右上角关闭按钮（禁用） -->
            <button class="close-btn" aria-label="关闭">×</button>

            <!-- 通知标题 -->
            <div class="notice-header">
                <span class="notice-icon">📢</span>
                <span class="notice-title">小通知</span>
            </div>

            <!-- 正文 -->
            <div class="notice-body">
                <p>亲爱的小同学，我们的网站要给自己放个小假啦～</p>
                <span class="highlight-date">8月2日</span>
                <p>起网站会暂停服务哦。</p>
            </div>

            <!-- 联系信息框 -->
            <div class="contact-box">
                <div class="contact-text">如果需要获取数据，或者想跟老师聊天，</div>
                <div class="contact-label">请加老师的微信：</div>
                <div class="contact-wx">ljc16607923402</div>
            </div>

            <!-- 底部文字 -->
            <div class="notice-footer">谢谢你的理解，我们很快会再见面的！🌈</div>
        </div>
    </div>

    <script>
        // ================= 禁止关闭弹窗的所有措施 =================

        // 1. 关闭按钮所有交互禁用
        const closeBtn = document.querySelector('.close-btn');
        if (closeBtn) {
            closeBtn.style.pointerEvents = 'none';
            closeBtn.style.cursor = 'not-allowed';
            closeBtn.onclick = e => { e.preventDefault(); e.stopPropagation(); };
            closeBtn.onmousedown = e => { e.preventDefault(); };
            closeBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); }, true);
            closeBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); }, { passive: false });
        }

        // 2. ESC 键阻止
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); }});

        // 3. 右键阻止
        document.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); });

        // 4. 拖拽阻止
        document.addEventListener('dragstart', e => { e.preventDefault(); e.stopPropagation(); });

        // 5. 触摸长按阻止
        document.addEventListener('touchstart', e => { if (e.target.closest('.modal, .modal-overlay')) { e.preventDefault(); e.stopPropagation(); } }, { passive: false });

        // 6. 遮罩点击拦截
        const overlay = document.getElementById('shutdownModal');
        if (overlay) overlay.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); }, { capture: true });

        // 7. 禁止滚动
        document.body.style.overflow = 'hidden';

        // 8. 确保置顶
        function ensureTop() {
            const modal = document.querySelector('.modal');
            const ov = document.querySelector('.modal-overlay');
            if (modal) modal.style.zIndex = '1001';
            if (ov) ov.style.zIndex = '1000';
        }
        ensureTop(); setInterval(ensureTop, 2000);

        // 9. DOM 方法覆写
        const origRemoveChild = Element.prototype.removeChild;
        Element.prototype.removeChild = function(child) {
            if (child && child.closest('.modal-overlay')) { console.error('❌ 禁止关闭服务通知弹窗！'); return null; }
            return origRemoveChild.apply(this, arguments);
        };

        const origRemove = Node.prototype.remove;
        Node.prototype.remove = function() {
            if (this.closest('.modal-overlay')) { console.error('❌ 禁止关闭服务通知弹窗！'); return; }
            return origRemove.apply(this, arguments);
        };

        // 10. 开发者工具快捷键阻止
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'j' || e.key === 'J'))) {
                e.preventDefault(); e.stopPropagation();
            }
        });

        // 11. 窗口方法屏蔽
        window.close = function() {}; window.moveTo = function() {}; window.moveBy = function() {};
        window.resizeTo = function() {}; window.resizeBy = function() {};

        // 12. 脉冲提醒（让模态框轻微缩放提醒用户）
        setInterval(() => {
            const modal = document.querySelector('.modal');
            if (modal) {
                modal.style.transform = 'scale(1.01)';
                setTimeout(() => { modal.style.transform = 'scale(1); transition: transform 0.3s ease; }, 300);
            }
        }, 6000);
    </script>
</body>
</html>
