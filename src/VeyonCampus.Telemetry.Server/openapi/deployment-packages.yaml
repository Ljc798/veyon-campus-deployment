openapi: 3.1.0
info:
  title: Veyon Campus Deployment Package API
  version: 1.0.0
  description: >-
    Teacher-published, server-validated Veyon Campus v3 configuration packages.
    Publishing is anonymous and requires campus name, teacher name, and the
    teacher phone's last four digits. The raw phone suffix is not stored; a
    keyed fingerprint is used to verify student downloads. The teacher name is
    retained privately for operational attribution. Mutations and downloads
    use Cache-Control: no-store. Application release reads and campus-level
    Teacher heartbeat are separate anonymous APIs; release writes are private.
servers:
  - url: https://{gatewayHost}
    description: CloudBase HTTP Gateway routed to the veyon-api HTTP Cloud Function
    variables:
      gatewayHost:
        default: veyon-control-d3gs8hmuyd09c00a7-1348081197.ap-shanghai.app.tcloudbase.com
tags:
  - name: Catalog
  - name: Publishing
  - name: Admin
  - name: Releases
  - name: Heartbeats
  - name: Monitoring
security: []
paths:
  /health:
    get:
      tags: [Monitoring]
      operationId: healthCheck
      summary: Check API readiness
      x-display-purpose: 检查 HTTP 云函数进程是否 ready。
      x-access: 公开只读
      x-live-check: health
      responses:
        '200':
          description: HTTP API is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }

  /v1/deployment-packages:
    get:
      tags: [Catalog]
      operationId: searchDeploymentPackages
      summary: Search published deployment packages
      x-display-purpose: 按校区名、电脑名前缀或校区编号搜索已发布配置包目录。
      x-access: 公开只读
      x-live-check: catalog
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Case-insensitive substring search over campus name and computer prefix.
        - name: campusId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 49, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: Published catalog page; never includes private storage keys.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PackageCatalogItem' }
                  limit: { type: integer }
                  offset: { type: integer }
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Publishing]
      operationId: publishDeploymentPackage
      summary: Publish a validated package with campus and teacher details
      x-display-purpose: 教师免登录发布 schema v3/v4/v5 配置包；服务端验证并写入私有对象存储。
      x-access: 公开写入；教师姓名保留在服务端，手机号后四位只用于校验
      description: >-
        No teacher account or login is required. Provide the campus name, teacher
        name, and teacher phone's last four digits. The phone suffix is used by
        students to download this package; the raw digits are never stored. The
        teacher name is retained privately and is not returned in the student
        catalog. Package content is restricted to public configuration files
        and validated again by the server. campusName must match the NFKC-normalized,
        trimmed campus value in manifest.json. The ZIP is limited to 64 KiB, each
        folder file to 16 KiB, and the request to 128 KiB.
        Submit either one ZIP in the archive field, or up to seven files in the
        files field. Folder uploads may include one shared top-level folder.
        The server validates and re-creates a canonical ZIP; client filenames
        and object keys are not used as storage names. The CloudBase HTTP gateway
        route is limited to 100 total requests per second.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [campusName, publisherName, teacherPhoneLast4]
              properties:
                campusName: { type: string, minLength: 1, maxLength: 100 }
                publisherName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Teacher name retained privately for operational attribution.
                teacherPhoneLast4:
                  type: string
                  pattern: '^[0-9]{4}$'
                  description: Used by students to verify and download this package; raw digits are not stored.
                archive:
                  type: string
                  format: binary
                  description: One schema v3/v4/v5 ZIP, at most 64 KiB.
                files:
                  type: array
                  maxItems: 7
                  items: { type: string, format: binary }
                  description: Flat package folder files; each at most 16 KiB, with at most 64 KiB in total.
            encoding:
              files:
                style: form
                explode: true
      responses:
        '201':
          description: Package object and metadata were published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedPackage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Request body exceeds 128 KiB. }
        '429': { description: The CloudBase gateway route limit of 100 total requests per second was reached. }
        '502': { $ref: '#/components/responses/CloudBaseRejected' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/deployment-packages/{packageId}/download:
    post:
      tags: [Catalog]
      operationId: downloadDeploymentPackage
      summary: Download a published package after teacher-phone-suffix verification
      x-display-purpose: 校验教师手机号后四位后下载并复验 ZIP。
      x-access: 公开写入；错误次数受限速规则保护
      parameters:
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacherPhoneLast4]
              properties:
                teacherPhoneLast4: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        '200':
          description: Canonical ZIP; content is checked against database size and SHA-256 before delivery.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment filename generated from packageId.
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: After ten incorrect suffixes for the same package and client fingerprint within a 15-minute failure window, the PostgreSQL RPC blocks that pair for 15 minutes across function instances. The response includes Retry-After. All attempts remain blocked until expiry; a successful verification outside an active block clears the failure state. Only a keyed client fingerprint is stored, not the raw address. }
        '502': { $ref: '#/components/responses/ArtifactUnavailable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/deployment-packages/{packageId}/withdraw:
    post:
      tags: [Publishing]
      operationId: withdrawDeploymentPackage
      summary: Withdraw a published package
      x-display-purpose: 撤回已发布配置包。
      x-access: CloudBase Auth；原发布者或 owner/admin（匿名发布包仅 owner/admin）
      description: Previously authenticated publishers or owner/admin accounts can withdraw older records; anonymously published packages require owner/admin withdrawal.
      security:
        - CloudBaseAccessToken: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '204': { description: Package withdrawn. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/CloudBaseRejected' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/admin/database/{table}:
    get:
      tags: [Admin]
      operationId: browseAdminDatabaseTable
      summary: Read a page from an allowlisted application table
      x-display-purpose: 分页读取数据库表记录；敏感 HMAC 与私有对象键由服务端遮罩。
      x-access: CloudBase Auth；owner/admin
      description: >-
        Requires an active CloudBase Auth access token and an owner/admin role
        in admin_profiles. The server selects the table, fields, and stable order
        from a fixed allowlist; callers cannot provide SQL, filters, columns, or
        ordering. HMAC identity fingerprints, client-address fingerprints, and
        private storage object keys are replaced with [已隐藏]. Results are
        uncached. Page offsets are capped at 1,000,000 rows.
      security:
        - CloudBaseAccessToken: []
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum:
              - admin_profiles
              - application_releases
              - campus_daily_teacher_heartbeats
              - campuses
              - deployment_package_artifacts
              - deployment_package_download_attempts
              - deployment_packages
              - telemetry_daily_deployment_devices
              - telemetry_daily_deployment_stats
              - telemetry_daily_hkt_devices
              - telemetry_daily_hkt_stats
              - telemetry_hkt_retention_state
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000001, default: 1 }
          description: One-based page number; the resulting offset must not exceed 1,000,000.
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: One page of selected rows with server-side redaction metadata.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [table, page, pageSize, rows, hasMore, redactedFields]
                properties:
                  table: { type: string }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 50 }
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/AdminDatabaseRow' }
                  hasMore: { type: boolean }
                  redactedFields:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The requested table is not in the allowlist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/admin/releases/dispatch-status:
    get:
      tags: [Admin, Releases]
      operationId: getAdminReleaseDispatchStatus
      summary: Read the protected release dispatch configuration state
      x-display-purpose: 查询后台受保护发行工作流是否已完成服务端配置。
      x-access: CloudBase Auth；owner/admin
      description: >-
        Requires an active CloudBase Auth access token and an owner/admin role
        in admin_profiles. Returns whether a server-side GitHub credential is
        configured and whether the fixed workflow is registered and active in
        GitHub Actions. Credential values are never returned.
      security:
        - CloudBaseAccessToken: []
      responses:
        '200':
          description: Release dispatch configuration state.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [configured, workflowReady, workflowError, repository, workflow, workflowUrl, tagPattern]
                properties:
                  configured: { type: boolean }
                  workflowReady: { type: boolean }
                  workflowError: { type: [string, 'null'] }
                  repository: { type: string, const: Ljc798/veyon-campus-deployment }
                  workflow: { type: string, const: windows-installers.yml }
                  workflowUrl: { type: string, format: uri }
                  tagPattern: { type: string, const: vX.Y.Z }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/admin/releases/dispatch:
    post:
      tags: [Admin, Releases]
      operationId: dispatchAdminApplicationRelease
      summary: Trigger the protected CI release workflow for an existing version tag
      x-display-purpose: 触发已存在稳定版本 tag 的 Windows 构建与签名发布工作流。
      x-access: CloudBase Auth；owner/admin；GitHub 凭据仅保存在服务端
      description: >-
        Requires an active CloudBase Auth access token and an owner/admin role
        in admin_profiles. The server accepts only an existing GitHub vX.Y.Z tag
        that is newer than both published application roles, and dispatches
        only when the fixed windows-installers.yml workflow is registered and
        active in GitHub Actions. The GitHub token is stored server-side and is
        never returned to the browser. The workflow uses its protected
        production-release environment for signing and publication.
      security:
        - CloudBaseAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tag]
              properties:
                tag:
                  type: string
                  pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
                  maxLength: 64
                  description: Existing stable GitHub tag; source version must match.
      responses:
        '202':
          description: GitHub accepted the workflow dispatch request.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, tag, workflow, workflowUrl, runUrl]
                properties:
                  accepted: { type: boolean, const: true }
                  tag: { type: string }
                  workflow: { type: string, const: windows-installers.yml }
                  workflowUrl: { type: string, format: uri }
                  runUrl: { type: [string, 'null'], format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The tag is not newer than a published release, a dispatch is already active, or the GitHub workflow is missing or disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502': { $ref: '#/components/responses/CloudBaseRejected' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/releases/latest:
    get:
      tags: [Releases]
      operationId: getLatestApplicationRelease
      summary: Read the latest published signed application release
      x-display-purpose: 读取角色与架构对应的最新签名发行清单。
      x-access: 公开只读
      x-live-check: releases
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [TeacherConsole, StudentSetup] }
        - name: architecture
          in: query
          required: false
          schema: { type: string, const: win-x64, default: win-x64 }
      responses:
        '200':
          description: Latest semantically sorted published release, or null when none exists.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release:
                    oneOf:
                      - { $ref: '#/components/schemas/ApplicationRelease' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v2/releases/latest:
    get:
      tags: [Releases]
      operationId: getLatestApplicationReleaseWithPolicyCapabilities
      summary: Read the latest signed application release with policy capabilities
      x-display-purpose: 读取包含 Student SYSTEM Policy 能力声明的最新版签名发行清单；保留旧版双签名 API 兼容。
      x-access: 公开只读
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [TeacherConsole, StudentSetup] }
        - name: architecture
          in: query
          required: false
          schema: { type: string, const: win-x64, default: win-x64 }
      responses:
        '200':
          description: Latest semantically sorted signed release, or null when none exists.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release:
                    oneOf:
                      - { $ref: '#/components/schemas/ApplicationRelease' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v3/releases/latest:
    get:
      tags: [Releases]
      operationId: getLatestApplicationReleaseWithPolicyCapabilitiesV3
      summary: Read the latest signed application release with application and system policy capabilities
      x-display-purpose: 读取同时声明课堂应用与学生系统策略兼容能力的最新版签名发行清单；保留旧版双签名 API 兼容。
      x-access: 公开只读
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [TeacherConsole, StudentSetup] }
        - name: architecture
          in: query
          required: false
          schema: { type: string, const: win-x64, default: win-x64 }
      responses:
        '200':
          description: Latest semantically sorted signed release, or null when none exists.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release:
                    oneOf:
                      - { $ref: '#/components/schemas/ApplicationRelease' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/releases/{releaseId}/artifact:
    get:
      tags: [Releases]
      operationId: downloadApplicationReleaseArtifact
      summary: Redirect to a short-lived URL for a private signed installer object
      x-display-purpose: 为私有安装器对象签发短时下载跳转。
      x-access: 公开只读；短时签名 URL
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: Private storage redirect; installer bytes do not pass through the HTTP Function.
          headers:
            Location: { schema: { type: string, format: uri } }
            Cache-Control: { schema: { type: string, const: no-store } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/heartbeat:
    post:
      tags: [Heartbeats]
      operationId: recordStudentInstallationHeartbeat
      summary: Submit an anonymous daily Student installation heartbeat
      x-display-purpose: 接收学生端匿名每日心跳，按香港本地日期的 HMAC 去重。
      x-access: 公开写入；不保存原始安装标识
      description: >-
        No login is required. The service stores daily keyed HMACs of the
        installation and optional deployment identifiers with the application
        version; raw identifiers are not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installationId]
              properties:
                installationId: { type: string, pattern: '^[0-9A-Fa-f]{32}$' }
                applicationVersion:
                  type: [string, 'null']
                  maxLength: 64
                  pattern: '^(?:unknown|[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:[-+][0-9A-Za-z.-]+)?)$'
                  default: unknown
                deploymentId:
                  type: [string, 'null']
                  format: uuid
      responses:
        '204':
          description: Daily installation heartbeat recorded or updated.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/heartbeat/teacher:
    post:
      tags: [Heartbeats]
      operationId: recordTeacherCampusHeartbeat
      summary: Submit an anonymous daily campus-level Teacher heartbeat
      x-display-purpose: 记录教师端每日校区快照和配置电脑数。
      x-access: 公开写入；不保存原始发布者标识
      description: >-
        No login is required. The service maps the published packageId to a
        campus and upserts one row per campus per Asia/Hong_Kong calendar day.
        It stores a daily HMAC of publisherInstanceId alongside versions,
        packageId, and the bounded configured computer count; the raw publisher
        ID is not stored. Packages without a registered campus are grouped by a
        pseudonymous digest of their normalized campus name and computer prefix.
        The studentVersion request value is a fallback; when the release catalog
        is available, the service records its latest StudentSetup version and
        returns both latest signed release envelopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publisherInstanceId, packageId, teacherVersion, studentVersion, configuredComputerCount]
              properties:
                publisherInstanceId: { type: string, pattern: '^[0-9A-Fa-f]{32}$' }
                packageId: { type: string, format: uuid }
                teacherVersion: { type: string, maxLength: 64 }
                studentVersion: { type: string, maxLength: 64 }
                configuredComputerCount: { type: integer, minimum: 0, maximum: 150 }
      responses:
        '200':
          description: Daily campus snapshot recorded or updated, with the latest signed releases for TeacherConsole and StudentSetup when the release catalog is available.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [latestReleases]
                properties:
                  latestReleases:
                    type: object
                    additionalProperties: false
                    required: [teacherConsole, studentSetup]
                    properties:
                      teacherConsole:
                        oneOf:
                          - { $ref: '#/components/schemas/ApplicationRelease' }
                          - { type: 'null' }
                      studentSetup:
                        oneOf:
                          - { $ref: '#/components/schemas/ApplicationRelease' }
                          - { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/CloudBaseRejected' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    CloudBaseAccessToken:
      type: http
      scheme: bearer
      bearerFormat: CloudBase Auth access_token
  parameters:
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AdminDatabaseRow:
      type: object
      description: A row from the selected allowlisted table; properties depend on the table.
      additionalProperties: true
    ApplicationRelease:
      type: object
      additionalProperties: false
      required: [manifest, signatureAlgorithm, signature, publishedAt]
      properties:
        manifest: { $ref: '#/components/schemas/ApplicationReleaseManifest' }
        signatureAlgorithm: { type: string, const: RSA-PSS-SHA256 }
        signature: { type: string, contentEncoding: base64 }
        publishedAt: { type: string, format: date-time }
    ApplicationReleaseManifest:
      oneOf:
        - { $ref: '#/components/schemas/ApplicationReleaseManifestV1' }
        - { $ref: '#/components/schemas/ApplicationReleaseManifestV2' }
        - { $ref: '#/components/schemas/ApplicationReleaseManifestV3' }
    ApplicationReleaseManifestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, product, role, version, architecture, fileName, sizeBytes, sha256, downloadUrl]
      properties:
        schemaVersion: { type: integer, const: 1 }
        product: { type: string, enum: [VeyonCampus.TeacherConsole, VeyonCampus.StudentSetup] }
        role: { type: string, enum: [TeacherConsole, StudentSetup] }
        version: { type: string, maxLength: 64 }
        architecture: { type: string, const: win-x64 }
        fileName: { type: string, pattern: '^VeyonCampus-(Teacher|Student)-Setup-.+-win-x64\.exe$' }
        sizeBytes: { type: integer, minimum: 1, maximum: 536870912 }
        sha256: { type: string, pattern: '^[A-F0-9]{64}$' }
        downloadUrl: { type: string, format: uri }
    ApplicationReleaseManifestV2:
      type: object
      additionalProperties: false
      required: [schemaVersion, product, role, version, architecture, fileName, sizeBytes, sha256, downloadUrl, policyCapabilities]
      properties:
        schemaVersion: { type: integer, const: 2 }
