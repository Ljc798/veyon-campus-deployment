openapi: 3.1.0
info:
  title: Veyon Campus Deployment Package API
  version: 1.0.0
  description: >-
    Teacher-published, server-validated Veyon Campus v3 configuration packages.
    Public publishing accepts small validated packages, records a private teacher
    identity fingerprint, and requires the teacher's phone suffix to download.
servers:
  - url: https://{gatewayHost}
    description: CloudBase HTTP Gateway after CloudRun and route setup
    variables:
      gatewayHost:
        default: veyon-control-d3gs8hmuyd09c00a7-1348081197.ap-shanghai.app.tcloudbase.com
tags:
  - name: Catalog
  - name: Publishing
  - name: Authorization
security: []
paths:
  /v1/deployment-packages:
    get:
      tags: [Catalog]
      operationId: searchDeploymentPackages
      summary: Search published deployment packages
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Case-insensitive substring search over campus name and computer prefix.
        - name: campusId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 49, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: Published catalog page; never includes private storage keys.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PackageCatalogItem' }
                  limit: { type: integer }
                  offset: { type: integer }
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Publishing]
      operationId: publishDeploymentPackage
      summary: Publish a validated package without login
      description: >-
        Anyone may publish a package using a self-declared campus name. Package
        content is restricted to the public configuration files and validated
        again by the server. The teacher name and phone suffix are not returned
        by catalog APIs; only server-keyed fingerprints are stored. The ZIP is
        limited to 64 KiB, each folder file to 16 KiB, and the request to 128 KiB.
        Submit either one ZIP in the archive field, or up to five files in the
        files field. Folder uploads may include one shared top-level folder.
        The server validates and re-creates a canonical ZIP; client filenames
        and object keys are not used as storage names.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [campusName, teacherName, mobileLast4]
              properties:
                campusName: { type: string, minLength: 1, maxLength: 100 }
                teacherName: { type: string, minLength: 1, maxLength: 32 }
                mobileLast4: { type: string, pattern: '^[0-9]{4}$' }
                archive:
                  type: string
                  format: binary
                  description: One schema v3 ZIP, at most 64 KiB.
                files:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
                  description: Flat package folder files; each at most 16 KiB, with at most 64 KiB in total.
            encoding:
              files:
                style: form
                explode: true
      responses:
        '201':
          description: Package object and metadata were published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedPackage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Request body exceeds 128 KiB. }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/deployment-package-campuses:
    get:
      tags: [Publishing]
      operationId: listDeploymentPackageCampuses
      summary: List active campuses available for public publishing
      responses:
        '200':
          description: Legacy active campus list. New publishers enter the full campus name instead.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [campusId, campusName]
                      properties:
                        campusId: { type: integer, format: int64, minimum: 1 }
                        campusName: { type: string, maxLength: 100 }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/deployment-packages/{packageId}/download:
    post:
      tags: [Catalog]
      operationId: downloadDeploymentPackage
      summary: Download a published package after phone suffix verification
      parameters:
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneLast4]
              properties:
                phoneLast4: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        '200':
          description: Canonical ZIP; content is checked against database size and SHA-256 before delivery.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment filename generated from packageId.
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Too many failed phone suffix attempts; retry after the Retry-After interval. }
        '502': { $ref: '#/components/responses/ArtifactUnavailable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/deployment-packages/mine:
    post:
      tags: [Publishing]
      operationId: findMyDeploymentPackages
      summary: Find packages matching the publisher's teacher name and phone suffix
      description: Returns public package metadata only; identity values and fingerprints are not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacherName, mobileLast4]
              properties:
                teacherName: { type: string, minLength: 1, maxLength: 32 }
                mobileLast4: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        '200': { description: Matching published package metadata. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/deployment-packages/{packageId}/withdraw:
    post:
      tags: [Publishing]
      operationId: withdrawDeploymentPackage
      summary: Withdraw a published package
      description: Only the publisher or an owner/admin account can withdraw it.
      security:
        - CloudBaseAccessToken: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '204': { description: Package withdrawn. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/deployment-package-publishers:
    post:
      tags: [Authorization]
      operationId: setDeploymentPackagePublisher
      summary: Grant or revoke a teacher's campus publishing permission
      description: Restricted to CloudBase owner/admin accounts.
      security:
        - CloudBaseAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, campusId, isActive]
              properties:
                userId: { type: string, minLength: 1, maxLength: 64 }
                campusId: { type: integer, format: int64, minimum: 1 }
                isActive: { type: boolean }
      responses:
        '204': { description: Publishing permission updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/deployment-package-publishers/me:
    get:
      tags: [Authorization]
      operationId: listMyPublishableCampuses
      summary: List campuses available to the signed-in publisher
      description: Owner/admin accounts receive all active campuses; other accounts receive their active campus assignments.
      security:
        - CloudBaseAccessToken: []
      responses:
        '200':
          description: Active campuses for which the signed-in user may publish.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [campusId, campusName]
                      properties:
                        campusId: { type: integer, format: int64, minimum: 1 }
                        campusName: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    CloudBaseAccessToken:
      type: http
      scheme: bearer
      bearerFormat: CloudBase Auth access_token
  parameters:
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    PackageCatalogItem:
      type: object
      required:
        - packageId
        - campusId
        - displayName
        - campusName
        - computerPrefix
        - schemaVersion
        - targetOs
        - architecture
        - fileName
        - sizeBytes
        - sha256
        - downloadCount
        - publishedAt
        - requiresPhoneVerification
      properties:
        packageId: { type: string, format: uuid }
        campusId: { type: integer, format: int64, nullable: true }
        displayName: { type: string }
        campusName: { type: string }
        computerPrefix: { type: string, maxLength: 12 }
        schemaVersion: { type: integer, const: 3 }
        targetOs: { type: string, const: windows }
        architecture: { type: string, const: x64 }
        fileName: { type: string, pattern: '^veyon-campus-config-v3-[a-f0-9]{32}\\.zip$' }
        sizeBytes: { type: integer, minimum: 1, maximum: 524288 }
        sha256: { type: string, pattern: '^[A-F0-9]{64}$' }
        downloadCount: { type: integer, format: int64, minimum: 0 }
        publishedAt: { type: string, format: date-time }
        requiresPhoneVerification: { type: boolean }
    PublishedPackage:
      type: object
      required: [packageId, campusId, campusName, computerPrefix, schemaVersion, targetOs, architecture, fileName, sizeBytes, sha256]
      properties:
        packageId: { type: string, format: uuid }
        campusId: { type: integer, format: int64, nullable: true }
        campusName: { type: string }
        computerPrefix: { type: string }
        schemaVersion: { type: integer, const: 3 }
        targetOs: { type: string, const: windows }
        architecture: { type: string, const: x64 }
        fileName: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
    Problem:
      type: object
      properties:
        error: { type: string }
        title: { type: string }
        status: { type: integer }
  responses:
    BadRequest:
      description: Invalid query, package contents, or request fields.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Missing, invalid, or expired CloudBase Auth access token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: User does not have the required campus publishing permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Active campus or published package was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The packageId has already been published.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    ArtifactUnavailable:
      description: Stored object is missing or does not match its recorded hash and size.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: CloudBase Auth, PostgreSQL, or PG Storage is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
