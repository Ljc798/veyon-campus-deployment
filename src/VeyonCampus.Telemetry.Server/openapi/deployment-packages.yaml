        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ArtifactUnavailable:
      description: Stored object is missing or does not match its recorded hash and size.
